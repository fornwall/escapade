[package]
name = "escapade"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Demonstrate, visualize and actually use modern terminal features"
authors = ["Fredrik Fornwall <fredrik@fornwall.net>"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/fornwall/escapade"
keywords = ["terminal", "escape-sequences", "tui", "glyph-protocol", "kitty"]
categories = ["command-line-utilities", "command-line-interface"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.0"
clap = { version = "4.6.4", features = ["derive", "wrap_help"] }
crossterm = "0.29.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "gif", "webp"] }
infer = "0.22.0"
inferno = "0.12.8"
miniz_oxide = "0.9.1"
resvg = "0.48.1"
serde = { version = "1.0.229", features = ["derive"] }
termimad = "0.35.1"
toml = "1.1.4"
unicode-properties = "0.1.4"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
unicode_names2 = "3.1.0"

[lints.rust]
# Everything here is escape sequences and byte twiddling; none of it needs unsafe.
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_qualifications = "warn"
# `unreachable_pub` is deliberately absent: this is a binary crate, so every
# module is private and the lint fires on every `pub fn` in it. The modules are
# written as if they were libraries — that is what keeps them reusable — and
# `pub(crate)` everywhere would only add noise.

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Targeted picks from restriction/nursery that catch real mistakes.
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
# Prose in doc comments reads better without backticks around every product name.
doc_markdown = "allow"
module_name_repetitions = "allow"

[profile.release]
strip = true
