# ---------------------------------------------------------------------------
# Terminal support matrix.
#
# status: yes | partial | flag | passthrough | no | unknown
#   yes         implemented and on by default
#   partial     implemented with meaningful gaps (say which in `notes`)
#   flag        implemented but off until the user opts in
#   passthrough  multiplexer: works only when explicitly configured to forward
#   no          no known implementation
#   unknown     nobody has checked
#
# "partial" does a lot of work in this table: almost every implementation other
# than kitty's is missing animation, Unicode placeholders, or both.
# ---------------------------------------------------------------------------

[[support]]
terminal = "kitty"
status = "yes"
since = "2017; animation in 0.20.0, placeholders 0.28.0, relative placements 0.31.0, usage hints 0.48.0"
notes = "The reference implementation, and the definition of complete: it is where the specification lives."
source = "https://sw.kovidgoyal.net/kitty/graphics-protocol/"

[[support]]
terminal = "ghostty"
status = "partial"
since = "1.0.0 (2024-12)"
notes = '''Everything except animation, which is refused outright with "ERROR: unimplemented action" — unchanged since 1.0. Unicode placeholders are fully implemented. Relative placements are parsed but unused. z-index stacking is known to be wrong in some cases, and classic (non-placeholder) placements do not scroll with `CSI` scroll commands.'''
source = "https://github.com/ghostty-org/ghostty/issues/8272"

[[support]]
terminal = "wezterm"
status = "partial"
since = "20220101-133340; shared memory 20220408"
notes = '''No Unicode placeholders — the long-standing gap, tracked in issue 4531. Frame transmission (`a=f`) and composition (`a=c`) work and auto-play, but animation *control* (`a=a`) does not, so there is no stop, start or loop count. Note that the last stable release was 2024-02-03: anyone not running a nightly has that feature set.'''
source = "https://github.com/wezterm/wezterm/issues/4531"

[[support]]
terminal = "iterm2"
status = "partial"
since = "3.5.6 (2024-11), after 3.5.4beta2"
notes = '''The implementing commit says it plainly: "Implement Kitty graphics protocol, except animation." Still true on master. Unicode placeholders and relative placements are both implemented; file and shared-memory transmission arrived later, in the 3.5.15beta/3.6 line. iTerm2 also has its own, much simpler inline-images protocol (`OSC 1337 ; File=`), which predates this one.'''
source = "https://github.com/gnachman/iTerm2/commit/4fe5b2173193b6c3e45234b6b2ab7a144a5cfa01"

[[support]]
terminal = "rio"
status = "partial"
since = "0.3.0 (2026-04); full Unicode placeholders in 0.5.0 (2026-07)"
notes = '''All four transmission media, zlib, z-index, broad deletion, chunking and full Unicode placeholder support. No animation: `a=f`, `a=a` and `a=c` are answered with `EINVAL:unsupported action`. Relative placement keys are parsed but never acted on.'''
source = "https://rioterm.com/docs/features/kitty-graphics-protocol"

[[support]]
terminal = "st"
status = "partial"
since = "patch series by Sergei Grechanik; latest 2025-12, for st 0.9.3"
notes = '''Needs patching, so it is a build-time choice rather than a feature of st. Notable because the patch is by the author of the Unicode placeholder design itself, and its README documents exactly what works: all four media, zlib, placeholders, and experimental animation (`a=f` and `a=a` yes, `a=c` no). No z-index — overlapping placements erase what was under them — and no relative placements. Vanilla st has no graphics at all, nor `CSI 14 t`.'''
source = "https://github.com/sergei-grechanik/st-graphics"

[[support]]
terminal = "konsole"
status = "partial"
since = "22.04 (2022-04)"
notes = '''Direct transmission only: any `t` other than `d` is answered with `ENOTSUPPORTED`. No animation, no Unicode placeholders, no relative placements. The parsed key set is unchanged since it landed, so treat this as a stable subset rather than work in progress. The exact release is inferred by bisecting tags — the merge request carries no milestone.'''
source = "https://invent.kde.org/utilities/konsole/-/merge_requests/594"

[[support]]
terminal = "warp"
status = "partial"
since = "2025 (v0.2025.03.26.08.10 or later)"
notes = "Advertised as full support for the kitty image protocol. Not independently verified here, and Warp is closed-source, so the gaps — if there are any — cannot be checked the way the others can."
source = "https://www.warp.dev/blog/launch-log-2"

[[support]]
terminal = "wayst"
status = "partial"
since = "2020-09 (git only — there are no releases)"
notes = '''Self-described as experimental, and git-master only. Direct and file transmission; shared memory is parsed and then rejected. `z` is never parsed at all, so every image sits at z-index 0. No placeholders, no animation. Its `CSI 14 t` reply is malformed — an extra semicolon, with width and height swapped.'''
source = "https://github.com/91861/wayst"

[[support]]
terminal = "vscode"
status = "flag"
since = "1.110 (2026-02)"
notes = '''Needs `terminal.integrated.enableImages` plus GPU acceleration. It consumes the xterm.js image addon's beta line, and explicitly does not support animation, relative placements, Unicode placeholders or file-based transmission. The published documentation page still says sixel and iTerm2 only.'''
source = "https://code.visualstudio.com/updates/v1_110"

[[support]]
terminal = "contour"
status = "unknown"
since = "unreleased — on main since 2026-07"
notes = '''Landed on `main` in July 2026 and is in no release yet, so "unknown" is the honest status for anything a user can install today. Even on main it is deliberately minimal: direct transmission only, no compression, no animation, no Unicode placeholders. The comment for refusing `t=f` is that it "would let it point the terminal at any file the user can read".'''
source = "https://github.com/contour-terminal/contour"

[[support]]
terminal = "foot"
status = "no"
notes = '''Declined, repeatedly and on the record: APC strings are discarded outright by the parser. The maintainer, on a 2026 request: "while that issue is still open, I don't really see us implementing another graphics protocol." foot has supported sixel since 1.2.0.'''
source = "https://codeberg.org/dnkl/foot/issues/2342"

[[support]]
terminal = "alacritty"
status = "no"
notes = '''No graphics protocol of any kind, sixel included, and declined as recently as July 2026: "Alacritty is intended to be much more conservative… the best way to avoid running into them is by not implementing support."'''
source = "https://github.com/alacritty/alacritty/issues/910"

[[support]]
terminal = "windows-terminal"
status = "no"
notes = "Open since 2020, priority 3, milestone Backlog. Sixel shipped in 1.22 (preview 2024-08, stable 2025-02), so images are possible there — just not this way."
source = "https://github.com/microsoft/terminal/issues/8389"

[[support]]
terminal = "gnome-terminal"
status = "no"
notes = "No implementation in VTE, and no tracking issue to point at — so this is \"unimplemented\", not \"declined\". VTE does have sixel support, double-gated behind a build option and a runtime default that are both off."
source = "https://gitlab.gnome.org/GNOME/vte/-/issues/253"

[[support]]
terminal = "xterm"
status = "no"
notes = "By design: \"xterm implements no APC functions; Pt is ignored.\" xterm is where sixel support is best, and needs a vt340-class terminal id to enable it."
source = "https://invisible-island.net/xterm/ctlseqs/ctlseqs.html"

[[support]]
terminal = "tmux"
status = "passthrough"
notes = '''No native support in any release — there is not a single mention of kitty in the source. `set -g allow-passthrough on` (3.3+) forwards the bytes verbatim and does nothing else: no parsing, no image tracking, no cursor offsetting. So classic placements stay at absolute pixel positions while text scrolls, survive `Ctrl-L` as ghosts, and can draw over neighbouring panes. **Unicode placeholders do work**, because those cells are ordinary text, and kitty's `icat` switches to them automatically inside tmux — but the outer terminal must implement placeholders too. tmux's own image support is sixel-only, behind `--enable-sixel`. An unmerged native implementation exists on the `ta/kitty-img` branch, dormant since March 2026.'''
source = "https://github.com/tmux/tmux/issues/4902"

[[support]]
terminal = "zellij"
status = "no"
notes = '''No support, and no passthrough equivalent either. The cause is structural: Zellij parses with the `vte` crate, whose `Perform` trait has no APC callback, so the sequence is discarded with nowhere to hook in. Sixel is supported natively since 0.31.0. The request has been open since September 2023 with no maintainer comment — which is not the same as a refusal, whatever the internet says.'''
source = "https://github.com/zellij-org/zellij/issues/2814"

[[support]]
terminal = "screen"
status = "no"
notes = "APC strings are consumed and used to set the hardstatus line. No sixel either, in 5.0.x."
source = "https://ftp.gnu.org/gnu/screen/"

