[[user]]
name = "Contour"
kind = "terminal"
url = "https://github.com/contour-terminal/contour"
notes = "Where the specification came from, and the first implementation."

[[user]]
name = "Ghostty"
kind = "terminal"
url = "https://ghostty.org/docs/config/reference"
notes = "Implements the mode, and lets users choose the default independently through `grapheme-width-method`; the mode overrides that setting while it is set."

[[user]]
name = "foot"
kind = "terminal"
url = "https://codeberg.org/dnkl/foot"
notes = "Implements DECSET/DECRST/DECRQM for the mode, and answers permanently reset when its configured width method could not honour it."

[[user]]
name = "WezTerm"
kind = "terminal"
url = "https://wezterm.org"
notes = "Produced clustered widths before the mode existed; DECRQM support was added so applications could detect it."

[[user]]
name = "kitty"
kind = "terminal, dissenting"
url = "https://sw.kovidgoyal.net/kitty/text-sizing-protocol/"
notes = "Declined the mode and specified the text sizing protocol instead, where the application states the width so the two cannot disagree."

[[user]]
name = "escapade"
kind = "application"
url = "https://github.com/fornwall/escapade"
notes = "`escapade grapheme probe` asks with DECRQM and then measures with `CSI 6 n`, and reports the two separately when they disagree."

# ---------------------------------------------------------------------------
# Terminal support matrix.
#
# status: yes | partial | flag | passthrough | no | unknown
#   yes         implemented and on by default
#   partial     implemented with meaningful gaps (say which in `notes`)
#   flag        implemented but off until the user opts in
#   passthrough multiplexer: works only when explicitly configured to forward
#   no          no known implementation
#   unknown     nobody has checked
#
# The interesting distinction in this table is not really yes/no. It is between
# terminals that implement *the mode* and terminals that merely happen to get
# cluster widths right; an application that only checks DECRQM will misjudge
# both kinds. `escapade grapheme probe` measures as well as asking.
# ---------------------------------------------------------------------------

[[support]]
terminal = "contour"
status = "yes"
notes = "The specification's home and first implementation. Reports clustered widths for ZWJ sequences."
source = "https://github.com/contour-terminal/terminal-unicode-core"

[[support]]
terminal = "ghostty"
status = "yes"
notes = "Implements the mode. `grapheme-width-method = unicode` is the default, so clustered widths are already in effect and the mode's job is to force them regardless of configuration; with the mode set, Unicode widths win even if the setting says otherwise. Resetting it returns to the configured method."
source = "https://ghostty.org/docs/config/reference"

[[support]]
terminal = "foot"
status = "yes"
since = "master, merged 2023-09"
notes = "DECSET/DECRST/DECRQM all implemented. Reports **permanently reset** when `tweak.grapheme-width-method` is not `double-width` — an honest `4` rather than a silent failure, and exactly the case a probe must not report as plain unsupported."
source = "https://codeberg.org/dnkl/foot/pulls/1489"

[[support]]
terminal = "wezterm"
status = "yes"
since = "nightly after 2023-09"
notes = "Already produced clustered widths before the mode existed; DECRQM support was added so applications could detect it. The change landed in nightly first, so check the release you are on."
source = "https://github.com/wezterm/wezterm/issues/4320"

[[support]]
terminal = "iterm2"
status = "partial"
notes = "Measured 2 cells for a ZWJ emoji, so its width logic already agrees with segmentation for the common cases — but no mode 2027 implementation is known.\n\n**Its DECRQM lies confidently.** iTerm2 answers `4` (permanently reset) for modes it has never heard of, fictional numbers included, so a `4` for mode 2027 is not a statement about grapheme clustering at all. A probe that reads it as one reports the exact opposite of the truth here: a terminal that clusters correctly, filed as having firmly refused to. Query an impossible mode as a control, and measure."
source = "https://mitchellh.com/writing/grapheme-clusters-in-terminals"

[[support]]
terminal = "rio"
status = "unknown"
notes = "Not covered by the survey this table draws on, and no implementation has been verified either way."

[[support]]
terminal = "konsole"
status = "unknown"
notes = "No mode 2027 implementation is known, and Konsole implements no DECRQM at all — it answers the device-attributes barrier and says nothing about any mode, real or invented. That is a definite finding about the *query* and no finding at all about clustering, so its cell widths have to be measured rather than asked about."

[[support]]
terminal = "kitty"
status = "no"
notes = "Declined deliberately rather than overlooked. kitty specifies the exact segmentation algorithm it uses (UAX29-C1-1) and offers the **text sizing protocol** as the alternative: `OSC 66 ; w=2 ; <text> ST` lets the application state the width, which removes the disagreement instead of negotiating it. Measured 4 cells for the farmer emoji."
source = "https://sw.kovidgoyal.net/kitty/text-sizing-protocol/"

[[support]]
terminal = "alacritty"
status = "no"
notes = "Per-codepoint widths; measured 4 cells for a three-codepoint ZWJ emoji."
source = "https://mitchellh.com/writing/grapheme-clusters-in-terminals"

[[support]]
terminal = "gnome-terminal"
status = "no"
notes = "VTE counts per codepoint; measured 4 cells in the survey."
source = "https://mitchellh.com/writing/grapheme-clusters-in-terminals"

[[support]]
terminal = "xterm"
status = "no"
notes = "Measured 4 cells. xterm implements DECRQM thoroughly, so it should answer `0` for this mode — an explicit, useful no."
source = "https://mitchellh.com/writing/grapheme-clusters-in-terminals"

[[support]]
terminal = "windows-terminal"
status = "no"
notes = "Measured 5 cells for the farmer emoji — neither the clustered nor the per-codepoint answer, which is its own category of wrong."
source = "https://mitchellh.com/writing/grapheme-clusters-in-terminals"

[[support]]
terminal = "vscode"
status = "no"
notes = "xterm.js has no mode 2027 implementation, and its width logic is per-codepoint, so ZWJ sequences overcount."
source = "https://github.com/xtermjs/xterm.js"

[[support]]
terminal = "tmux"
status = "no"
notes = "tmux does its own cell accounting and does not implement the mode, so inside tmux the answer that matters is tmux's. Passthrough cannot help: forwarding `CSI ? 2027 h` to the outer terminal would leave the two disagreeing about the same grid, which is worse than either being wrong alone."
source = "https://github.com/tmux/tmux"

[[support]]
terminal = "zellij"
status = "no"
notes = "The same shape of problem as tmux — Zellij owns the grid inside a pane, and no mode 2027 implementation is known."
source = "https://github.com/zellij-org/zellij"

[[support]]
terminal = "screen"
status = "no"
notes = "No implementation, and no realistic prospect of one."

