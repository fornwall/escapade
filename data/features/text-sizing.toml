# Who is using it.
# ---------------------------------------------------------------------------

[[user]]
name = "kitty"
kind = "terminal"
url = "https://sw.kovidgoyal.net/kitty/text-sizing-protocol/"
notes = "Author and reference implementation. Its own changelog puts it plainly: kitty is the first major terminal to introduce the concept of multiple sized text."

[[user]]
name = "foot"
kind = "terminal, the width half only"
url = "https://codeberg.org/dnkl/foot"
notes = "Implements `w` and logs the other keys as unsupported. Worth listing as a user rather than only as a matrix row, because it is the concrete proof that the two halves of this protocol are separable — and the spec blesses that tier explicitly."

[[user]]
name = "escapade"
kind = "application"
url = "https://github.com/fornwall/escapade"
notes = "`escapade textsize --scale 4 'BUILD PASSED'` draws it, and measures first so the text is printed plainly rather than lost on a terminal that would discard the string."

# ---------------------------------------------------------------------------
# Terminal support matrix.
#
# status: yes | partial | flag | passthrough | no | unknown
#   yes         implemented and on by default
#   partial     implemented with meaningful gaps (say which in `notes`)
#   flag        implemented but off until the user opts in
#   passthrough multiplexer: works only when explicitly configured to forward
#   no          no known implementation
#   unknown     nobody has checked
#
# Two terminals ship it: kitty in full, foot for the `w` key. Everything else in
# this table is a `no` backed by an OSC dispatch table that has no 66 in it, or
# an honest `unknown`. This is what a one-year-old protocol looks like.
# ---------------------------------------------------------------------------

[[support]]
terminal = "kitty"
status = "yes"
since = "0.40.0 (2025-03-08)"
notes = "Author and reference implementation: all six keys, the block geometry, the wrapping and discard rules, and the overwrite precedence. Its changelog claims the first: \"kitty is the first major terminal to introduce the concept of multiple sized text.\" 0.46.0 later fixed alignment and cropping of fractionally scaled text, so a build older than that is worth re-checking before blaming your own metadata."
source = "https://sw.kovidgoyal.net/kitty/changelog/"

[[support]]
terminal = "foot"
status = "partial"
since = "1.21.0 (2025-03-17)"
notes = "**The `w` key only** — nine days after kitty shipped the protocol, which tells you which half foot wanted. Its own changelog says so: \"Support for kitty's text-sizing protocol (`w`, width, only), OSC-66.\" In the source, `s`, `n`, `d` and `v` reach a `LOG_WARN` reading \"OSC-66: unsupported: '%c' parameter, ignoring\", and `h` is not in the switch at all. The text still renders — just unscaled — so foot is the case that makes a single support boolean wrong: it has the half that fixes width disagreements and not the half that draws banners."
source = "https://codeberg.org/dnkl/foot/raw/branch/master/CHANGELOG.md"

[[support]]
terminal = "contour"
status = "partial"
since = "master, merged 2026-07; targets 0.7.0"
notes = "**Not in any released version.** `src/vtbackend/TextSizing.h` exists in master and decodes all six keys, but the newest stable release, 0.6.3.8249 of 2026-04-09, predates the merge — so a Contour you can install today does not have this. Filed as partial rather than yes for that reason alone, and worth revisiting the day 0.7.0 ships."
source = "https://github.com/contour-terminal/contour/pull/2004"

[[support]]
terminal = "ghostty"
status = "no"
since = "parser only, 1.3.0 (2026-03-09)"
notes = "Parsed but not drawn, and the release notes say it in one line: \"vt: Parse Kitty text sizing protocol (OSC 66), not implemented in the GUI yet.\" The tracking issue is still open, and it scopes the first pass to the width key, \"following the approach taken by the Foot terminal\". Filed as no because that is what it means for an application: what happens to the payload of a parsed-but-unimplemented OSC 66 was not verified here, and a sequence that parses without rendering is a sequence whose text you have lost."
source = "https://ghostty.org/docs/install/release-notes/1-3-0"

[[support]]
terminal = "wezterm"
status = "no"
notes = "No OSC 66 in `wezterm-escape-parser/src/osc.rs`. Two open feature requests, neither answered by a maintainer — which is a request, not an implementation."
source = "https://github.com/wezterm/wezterm/issues/7061"

[[support]]
terminal = "rio"
status = "no"
notes = "An open issue, and a maintainer who wants to go a different way: \"I actually would prefer to Rio have its own version of it.\" Nothing implemented either way."
source = "https://github.com/raphamorim/rio/issues/1007"

[[support]]
terminal = "alacritty"
status = "no"
notes = "Declined rather than overlooked. The request was closed within minutes with \"If you want a GUI, you should be using a GUI toolkit\", which is a coherent position for a terminal whose whole thesis is doing less. No OSC 66 in `term/mod.rs`."
source = "https://github.com/alacritty/alacritty/issues/8910"

[[support]]
terminal = "windows-terminal"
status = "no"
notes = "Its `OscActionCodes` enum is the complete list of OSC numbers it dispatches — 0, 1, 2, 3, 4, 7, 8, 9, 10, 11, 12, 17, 21, 52, 104, 110, 111, 112, 117, 133, 633, 777, 1337, 9001 — and 66 is not among them. (The repository's apparent \"OSC 66\" hit is OSC 663, VS Code's prompt markup.)"
source = "https://github.com/microsoft/terminal/blob/main/src/terminal/parser/OutputStateMachineEngine.hpp"

[[support]]
terminal = "vscode"
status = "no"
notes = "No OSC 66 handler in xterm.js's `InputHandler.ts`, and a maintainer on the record in December 2025: \"I have seen the graphics protocol mentioned before but not the text sizing one.\""
source = "https://github.com/microsoft/vscode/issues/236991"

[[support]]
terminal = "konsole"
status = "no"
notes = "Konsole's `enum osc` lists 4, 9, 12, 22, 52, 99, 104, 112, 133, 777 and 1337. No 66, and no feature request found on bugs.kde.org."
source = "https://invent.kde.org/utilities/konsole/-/blob/master/src/Vt102Emulation.h"

[[support]]
terminal = "gnome-terminal"
status = "no"
notes = "VTE's `_VTE_OSC()` dispatch table has no entry for 66, which covers GNOME Terminal and everything else built on VTE. Worth a warning for anyone grepping: VTE uses **OSC 666** for its own termprops, and it is easy to read that as a hit."
source = "https://gitlab.gnome.org/GNOME/vte/-/blob/master/src/parser-osc.hh"

[[support]]
terminal = "xterm"
status = "no"
notes = "Nothing in `ctlseqs` for OSC 66, and nothing in the changelog about text sizing. The apparent matches are DEC private mode 66, DECNKM, which is the numeric keypad and unrelated. xterm's own answer to this problem is forty-five years older: DECDWL and DECDHL, `ESC # 6` and `ESC # 3` / `ESC # 4`."
source = "https://invisible-island.net/xterm/ctlseqs/ctlseqs.txt"

[[support]]
terminal = "mintty"
status = "no"
notes = "Checked properly, because it was the plausible dark horse — mintty implements a great deal of this sort of thing. Its Changelog, its `CtrlSeqs.md` and `termout.c` all have nothing for OSC 66 through 3.8.3 of 2026-06-09; its `66` is DECNKM again. It does have SGR 73/74/75 for superscript and subscript, which is adjacent to what `n`/`d` do and is not the same protocol."
source = "https://github.com/mintty/mintty/blob/master/wiki/Changelog.md"

[[support]]
terminal = "st"
status = "no"
notes = "`strhandle()` handles OSC 0, 1, 2, 4, 10, 11, 12, 52, 104, 110, 111 and 112. Third-party patches were not audited, as ever with st."
source = "https://git.suckless.org/st/file/st.c.html"

[[support]]
terminal = "wayst"
status = "no"
notes = "Read from the README's feature list rather than from the source: it names the kitty graphics protocol and Sixel and says nothing about text sizing, and the project has been dormant. Weaker evidence than the rows above; correct it if you know better."
source = "https://github.com/91861/wayst/blob/master/README.md"

[[support]]
terminal = "conemu"
status = "no"
notes = "Its last release is from 2023-07-24, about twenty months before this protocol existed. A release that predates a specification cannot implement it, which is the one kind of `no` that needs no source reading."
source = "https://github.com/Maximus5/ConEmu/releases"

[[support]]
terminal = "iterm2"
status = "no"
notes = "Not in its escape-code documentation and not in any 3.7.0 beta changelog through 2026-07-26, and no feature request was found. This row is from documentation rather than from source, so it is the weakest `no` in the table."
source = "https://iterm2.com/documentation-escape-codes.html"

[[support]]
terminal = "tmux"
status = "no"
notes = "Declined, on the record, the day it was asked: \"There is very little chance we will support this in the near future, sorry.\" **Passthrough does not rescue this one.** Wrapping `OSC 66` in tmux's `DCS tmux;` form would hand the sequence to the outer terminal while tmux went on believing the cell held one ordinary character — two programs laying out the same grid from different premises, which corrupts the pane rather than fixing it. Inside tmux, text sent through this protocol is simply lost."
source = "https://github.com/tmux/tmux/issues/4461"

[[support]]
terminal = "screen"
status = "no"
notes = "No OSC 66 handling in `src/ansi.c`, and the same structural objection as tmux: screen owns the cells inside a window."
source = "https://git.savannah.gnu.org/cgit/screen.git/plain/src/ansi.c"

[[support]]
terminal = "zellij"
status = "unknown"
notes = "No implementation was found and there is no issue or discussion of OSC 66 anywhere in the project — but that is evidence about the issue tracker, not about the code, and the source was not read. The structural argument that applies to tmux applies here too, which is a reason to expect a `no` rather than a reason to write one."

[[support]]
terminal = "warp"
status = "unknown"
notes = "Not checked."

