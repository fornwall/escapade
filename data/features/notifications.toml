# ---------------------------------------------------------------------------
# Terminal support matrix.
#
# status: yes | partial | flag | passthrough | no | unknown
#   yes         implemented and on by default
#   partial     implemented with meaningful gaps (say which in `notes`)
#   flag        implemented but off until the user opts in
#   passthrough  multiplexer: works only when explicitly configured to forward
#   no          no known implementation
#   unknown     nobody has checked
#
# `status` is one value per terminal, but this feature is three protocols — so
# every row says in `notes` which of the three it implements. `partial` here means
# "implements some but not all of the three". The per-protocol table that
# `escapade notification probe` resolves against lives in
# src/features/notification/probe.rs and must be kept in step with these notes.
# ---------------------------------------------------------------------------

[[support]]
terminal = "kitty"
status = "yes"
since = "0.18.0 (2020-08)"
notes = "**OSC 99** — the reference implementation, with icons, buttons, sounds, activation reports and the capability query — plus **OSC 9** for backwards compatibility. **OSC 777 is deliberately absent**: Kovid Goyal rejected it as \"a urxvt specific 'random command to terminal emulator for extension plugins' thing\"."
source = "https://github.com/kovidgoyal/kitty/issues/1474"

[[support]]
terminal = "foot"
status = "yes"
since = "1.6.0 (2020-12) for OSC 777"
notes = "All three: **OSC 9**, **OSC 777** and **OSC 99** with icon support (symbolic icon names only). Notifications go to a configurable command, `notify-send -a foot -i foot ${title} ${body}` by default. Only notifies while the window is **unfocused** — worth knowing before concluding it is broken."
source = "https://codeberg.org/dnkl/foot/pulls/236"

[[support]]
terminal = "contour"
status = "yes"
notes = "All three: **OSC 9** (rendered as a body under the title `ConEmu`), **OSC 777**, and **OSC 99** through a dedicated notification manager. Its OSC 777 handler requires **exactly three** semicolon-separated fields and ignores the notification otherwise, so a semicolon in the body loses it."
source = "https://github.com/contour-terminal/contour/blob/master/src/vtbackend/Screen.cpp"

[[support]]
terminal = "ghostty"
status = "partial"
notes = "**OSC 9** and **OSC 777**, both documented. **OSC 99 is requested but not documented as implemented.** Ghostty's own OSC 9 page warns against a title starting with a number followed by a semicolon, to avoid colliding with the ConEmu extensions — the clearest statement of that hazard anywhere."
source = "https://ghostty.org/docs/vt/osc/9"

[[support]]
terminal = "wezterm"
status = "partial"
notes = "**OSC 9** (\"show a toast notification\") and **OSC 777 ; notify** (\"only the notify extension is supported\"). **OSC 99 does not appear** in WezTerm's escape sequence reference."
source = "https://wezterm.org/escape-sequences.html"

[[support]]
terminal = "rio"
status = "partial"
notes = "**OSC 777 ; notify**, and **OSC 9** as a fallback when the payload is not a ConEmu progress report — in which case the notification gets an empty title. No OSC 99."
source = "https://github.com/raphamorim/rio/blob/main/rio-vt/src/performer/handler.rs"

[[support]]
terminal = "iterm2"
status = "partial"
notes = "**OSC 9 only** — the sequence iTerm2 invented, predating the current maintainer. One field of text, no title, no icons, and a per-profile preference to turn it off. Accepts `BEL` or `ESC \\` as the terminator. `OSC 1337 ; RequestAttention=yes` is the related, non-notification way to get noticed."
source = "https://iterm2.com/documentation-escape-codes.html"

[[support]]
terminal = "konsole"
status = "partial"
notes = "**OSC 777 only**, added so that applications already targeting kitty, foot and urxvt work unchanged. Routed through KDE's notification system."
source = "https://invent.kde.org/utilities/konsole/-/merge_requests/761"

[[support]]
terminal = "windows-terminal"
status = "flag"
notes = "**OSC 777 ; notify** only, gated behind an optional feature so it is off unless the build enables it. Note that **OSC 9 in Windows Terminal is ConEmu's taskbar progress**, not a notification — that collision is the reason to prefer OSC 777 here."
source = "https://github.com/microsoft/terminal/blob/main/src/terminal/adapter/adaptDispatch.cpp"

[[support]]
terminal = "gnome-terminal"
status = "no"
notes = "Upstream VTE implements none of the three. **Fedora carries a downstream patch** adding `OSC 777 ; notify ; SUMMARY ; BODY`, so notifications work on Fedora and not on other distributions running the same version — the most confusing support situation of any terminal here."
source = "https://src.fedoraproject.org/rpms/vte291"

[[support]]
terminal = "alacritty"
status = "no"
notes = "No notification protocol of any kind, consistent with Alacritty declining features it considers outside a terminal emulator's job."

[[support]]
terminal = "vscode"
status = "unknown"
notes = "Not properly verified. No notification OSC handler was found in the terminal platform code, and a marketplace extension exists to add one, which suggests it is not built in. Sending costs nothing, so `escapade` sends anyway."
source = "https://marketplace.visualstudio.com/items?itemName=wenbopan.vscode-terminal-osc-notifier"

[[support]]
terminal = "xterm"
status = "no"
notes = "xterm has no desktop-notification sequence. `bellIsUrgent` sets the window's urgency hint on `BEL`, which is the closest it comes."

[[support]]
terminal = "tmux"
status = "passthrough"
notes = "All three are filtered by default. Needs `set -g allow-passthrough on` plus `DCS tmux;` wrapping with every inner `ESC` doubled, and the outer terminal must implement whichever protocol was wrapped. tmux's own `monitor-activity` and `bell-action` are the in-multiplexer alternative, and they notify inside tmux rather than on the desktop."

[[support]]
terminal = "zellij"
status = "unknown"
notes = "Passthrough behaviour for these sequences has not been verified."

[[support]]
terminal = "screen"
status = "no"
notes = "GNU Screen has no passthrough for OSC strings it does not recognise, so none of the three reach the outer terminal."

