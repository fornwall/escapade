# ---------------------------------------------------------------------------
# Terminal support matrix.
#
# status: yes | partial | flag | passthrough | no | unknown
#   yes         implemented and on by default
#   partial     implemented with meaningful gaps (say which in `notes`)
#   flag        implemented but off until the user opts in
#   passthrough multiplexer: works only when explicitly configured to forward
#   no          no known implementation
#   unknown     nobody has checked
#
# kitty's own documentation carries a list headed "In addition to kitty, this
# protocol is also implemented in:", and that list is where several rows below
# start. It is not exhaustive — Contour implements the protocol and is not on it
# — so it is treated as a lead to check rather than as the answer.
#
# Flag-level coverage is stated only where a changelog or a source enumeration
# was actually read. "All five" below means the five bits were found declared and
# handled, not that every edge of every flag was exercised by hand.
# ---------------------------------------------------------------------------

[[support]]
terminal = "kitty"
status = "yes"
since = "0.20.0 (2021-04-19)"
notes = "Where the protocol comes from, and the reference implementation: all five flags, both stacks, the query. Its documentation also carries the list of other implementers, which is the starting point for several rows here."
source = "https://sw.kovidgoyal.net/kitty/keyboard-protocol/"

[[support]]
terminal = "ghostty"
status = "yes"
since = "1.0.0 (2024-12-26)"
notes = "All five flags were already present in the first public release — `src/terminal/kitty/key.zig` declares them as a packed five-bit struct, with a `FlagStack` implementing push, pop and set. No configuration option gates it, which is the right answer: the application opts in by sending the sequence, so a second gate in the terminal would only make the negotiation unreliable."
source = "https://github.com/ghostty-org/ghostty/blob/main/src/terminal/kitty/key.zig"

[[support]]
terminal = "foot"
status = "yes"
since = "1.10.3 (December 2021)"
notes = "Arrived in two steps, and the changelog names the modes in the specification's own words: 1.10.2 added \"Disambiguate escape codes (mode `0b1`)\", and 1.10.3 added the other four. So a foot older than 1.10.3 answers the query, honours flag 1, and honours nothing else — which is exactly the case a probe that only asks \"supported?\" gets wrong."
source = "https://codeberg.org/dnkl/foot/raw/branch/master/CHANGELOG.md"

[[support]]
terminal = "alacritty"
status = "yes"
since = "0.13.0 (2023-12-27)"
notes = "\"Support for kitty's keyboard protocol\", in one changelog line. Its `TermMode` bitflags declare all five bits, and Rio's implementation is a direct descendant of the pull request that landed it here. No configuration gate."
source = "https://github.com/alacritty/alacritty/blob/master/CHANGELOG.md"

[[support]]
terminal = "rio"
status = "yes"
since = "0.0.17 (2023-08-29); on by default from 0.2.3 (2025-01-13)"
notes = "All five flags, inherited from Alacritty's implementation. Worth knowing which Rio you are on: it sat behind `use-kitty-keyboard-protocol` for over a year, became the default in 0.2.3, and in 0.2.4 the option was removed outright — the changelog entry reads \"Breaking: Rio now doesn't allow anymore disable kitty keyboard protocol.\""
source = "https://rioterm.com/changelog"

[[support]]
terminal = "contour"
status = "yes"
since = "declared in 0.4.0.6245 (2023-12-19); trustworthy from 0.6.3 (2026-04-09)"
notes = "All five flags are declared in `src/vtbackend/InputGenerator.h` and have been since 0.4.0 — but 0.6.3 shipped a long run of corrections to this protocol specifically (the `CSI u` codes for F1 to F4, Home and End encoding, release events, lock modifiers, Unicode case folding), so \"declared early, dependable late\" is the honest reading. Not on kitty's own list of implementers, which is why that list is a lead rather than an answer."
source = "https://github.com/contour-terminal/contour/blob/master/src/vtbackend/InputGenerator.h"

[[support]]
terminal = "wezterm"
status = "flag"
since = "20220624-141144-bd1b7c5d"
notes = "The only implementation found that is **off by default**: `enable_kitty_keyboard` defaults to false, and the documentation says so in as many words. Which of the five flags it covers was not established — the option's documentation names none of them, and an issue tracker is not a support claim — so treat the per-flag detail as unknown and query after pushing."
source = "https://wezterm.org/config/lua/config/enable_kitty_keyboard.html"

[[support]]
terminal = "iterm2"
status = "yes"
since = "3.5.4beta2 (2024-09-09)"
notes = "\"Add support for the Kitty key reporting protocol\", in the changelog for that beta; `VT100TerminalKeyReportingFlags` declares all five bits. The first *stable* build carrying it is almost certainly 3.5.5, but iTerm2's changelog does not say so and that mapping is inference rather than a source."
source = "https://github.com/gnachman/iTerm2/blob/master/sources/VT100/VT100Terminal.h"

[[support]]
terminal = "vscode"
status = "yes"
since = "VS Code 1.109 (January 2026)"
notes = "The release notes are unambiguous: \"The Kitty keyboard protocol has been implemented and will be rolling out to stable this release.\" All five flags, in xterm.js's `KittyKeyboard.ts`, controlled by `terminal.integrated.enableKittyKeyboardProtocol` and on by default. One caveat for anyone embedding xterm.js directly rather than using VS Code: this landed in the 6.1.0 line, and the published `latest` is still 6.0.0."
source = "https://code.visualstudio.com/updates/v1_109"

[[support]]
terminal = "warp"
status = "yes"
notes = "A vendor claim rather than a source reading, because Warp is closed: \"Warp supports the Kitty keyboard protocol (CSI u progressive enhancement)… When a running app advertises that it supports the protocol, Warp emits the extended escape sequences automatically. No configuration is required.\" Which of the five flags that covers, and when it arrived, could not be established. Push and query."
source = "https://docs.warp.dev/terminal/more-features/full-screen-apps/"

[[support]]
terminal = "windows-terminal"
status = "partial"
since = "Preview 1.25.622.0 (2026-03-05)"
notes = "**Preview channel only.** All five flags with separate main and alternate screen stacks, merged in February 2026 — but the stable 1.24 line does not have it, so most Windows Terminal users do not. Known open gaps in the implementation as well: AltGr combinations and F13 to F20."
source = "https://github.com/microsoft/terminal/pull/19817"

[[support]]
terminal = "konsole"
status = "partial"
since = "merged 2026-05-04; in the 26.08 beta and release candidate"
notes = "**Not in a final release yet.** The implementation is complete — push, pop, query and set, with per-screen flag stacks and alternate keys resolved through xkbcommon — and it is in the `v26.07.80` beta and the `v26.07.90` release candidate, with 26.08.0 due on 2026-08-20. Filed as partial for availability rather than for capability; this row should become a plain yes shortly."
source = "https://invent.kde.org/utilities/konsole/-/commit/1983d2b4735d6b61b74cf85854acc1cb4d2445d5"

[[support]]
terminal = "zellij"
status = "partial"
since = "0.41.0 (2024-11-04)"
notes = "**Flag 1 only**, and implemented rather than forwarded. Zellij parses the `>`, `<`, `?` and `=` forms from a pane and answers the query itself with `CSI ? 1 u` or `CSI ? 0 u`, but its own source comment says \"Zellij only supports the first 'progressive enhancement' layer\" — it stores a single boolean rather than a stack, so there are no event types, no alternate keys and no associated text. It pushes `CSI > 1 u` to the terminal beyond it on startup and pops on teardown, and re-encodes keys rather than passing bytes through. `support_kitty_keyboard_protocol` defaults to true when the host terminal supports it."
source = "https://github.com/zellij-org/zellij/pull/3383"

[[support]]
terminal = "xterm"
status = "no"
notes = "The terminal with the other answer, and it is worth being precise about what it does have. `ctlseqs`, current through patch #410 of April 2026, documents `CSI u` only as **restore cursor** — there is no `CSI > flags u`, no `CSI ? u` and no key encoding of this shape anywhere in xterm's patch log, 1996 to 2026. What xterm has instead is `modifyOtherKeys`, set with `CSI > 4 ; 2 m`, encoding a modified key as `CSI 27 ; <modifiers> ; <codepoint> ~`. Its own documentation warns that the alternative `CSI u` spelling of that is something \"applications may confuse with `CSI u` (restore-cursor)\", which is a fair objection and is exactly why the kitty protocol's negotiation lives behind a private prefix."
source = "https://invisible-island.net/xterm/ctlseqs/ctlseqs.txt"

[[support]]
terminal = "gnome-terminal"
status = "no"
notes = "VTE has an open issue for it — #2601, \"Implementing the Kitty keyboard protocol\", opened in October 2022 and still open with no milestone. That covers GNOME Terminal and everything else built on VTE."
source = "https://gitlab.gnome.org/GNOME/vte/-/issues/2601"

[[support]]
terminal = "tmux"
status = "no"
notes = "**Neither implements it nor forwards it**, and the second half is the part that surprises people. tmux's CSI dispatch table has exactly one entry for a final `u` — restore cursor — and none at all for the `>`, `<`, `?` or `=` intermediates, so `CSI > 1 u` from a program inside tmux is an unrecognised sequence and is *dropped*, never relayed outward.\n\nWhat tmux has instead is the older mechanism: `extended-keys` (`off` by default, described in its own manual as \"the equivalent of the `modifyOtherKeys` xterm resource\") and `extended-keys-format` (`xterm` by default, `csi-u` optional). With `csi-u`, Ctrl+Shift+A arrives as `CSI 65 ; 6 u` — which is the fixterms *format* and not this protocol: no progressive-enhancement flags, no stack, no query, no event types, no alternate keys, no associated text. Added in 3.2, revamped in 3.5, and unchanged in that respect through master."
source = "https://github.com/tmux/tmux/blob/master/input.c"

[[support]]
terminal = "screen"
status = "no"
notes = "No mention of the protocol anywhere in the source through 5.0.0, and `ansi.c`'s handler for a final `u` is restore cursor. Screen has no `modifyOtherKeys` equivalent either, so there is no extended keyboard mechanism of any kind here."
source = "https://git.savannah.gnu.org/cgit/screen.git/tree/src/ansi.c"

[[support]]
terminal = "mintty"
status = "no"
notes = "The most interesting `no` in the table, because mintty *does* emit `CSI <code> ; <mods> u`. That is the fixterms format reached through xterm's `modifyOtherKeys`, not this protocol: its CSI dispatch handles a bare `u` (restore cursor) and two intermediate forms, and has no handler for `>`, `<` or `?` with a final `u`. Seeing `CSI 97 ; 5 u` come out of a terminal is not evidence that it speaks the kitty protocol — ask it."
source = "https://github.com/mintty/mintty/blob/master/src/termout.c"

[[support]]
terminal = "st"
status = "no"
notes = "No mention of the protocol in the source; `csihandle`'s final `u` is restore cursor, and any unrecognised CSI reaches `erresc: unknown csi` and is discarded. Patches exist for most things in st and were not audited."
source = "https://git.suckless.org/st/file/st.c.html"

[[support]]
terminal = "wayst"
status = "no"
notes = "Implements xterm's `modifyOtherKeys` instead; its final `u` is restore cursor, and the only occurrences of \"kitty\" in the source are shell-integration comments."
source = "https://github.com/91861/wayst/blob/master/src/vt_core.c"

[[support]]
terminal = "conemu"
status = "no"
notes = "No implementation, and no `modifyOtherKeys` either. Worth a warning for anyone grepping the source: ConEmu's matches for \"kitty\" are all references to **KiTTY**, the PuTTY-derived ssh client, which is an unrelated program with a confusingly similar name."
source = "https://github.com/Maximus5/ConEmu/blob/master/src/ConEmuHk/Entry.cpp"

